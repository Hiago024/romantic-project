<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Para Você ❤️</title>

<style>

/* =========================
   CONFIGURAÇÕES GERAIS
========================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    background: #000;
    font-family: Georgia, 'Times New Roman', serif;
    color: white;
}


/* =========================
   FUNDO NEON
========================= */

.fundo {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background:
        radial-gradient(
            circle at 50% 45%,
            rgba(110, 0, 255, 0.18),
            transparent 35%
        ),
        radial-gradient(
            circle at 20% 80%,
            rgba(255, 0, 130, 0.12),
            transparent 30%
        ),
        radial-gradient(
            circle at 80% 20%,
            rgba(0, 100, 255, 0.12),
            transparent 30%
        ),
        #000;
}


/* =========================
   PONTOS AMARELOS
========================= */

.ponto {
    position: absolute;
    width: 3px;
    height: 3px;
    background: #ffe600;
    border-radius: 50%;

    box-shadow:
        0 0 5px #ffe600,
        0 0 12px #ffe600,
        0 0 20px rgba(255, 230, 0, 0.7);

    animation: piscar 3s infinite ease-in-out;
}

@keyframes piscar {

    0%, 100% {
        opacity: 0.2;
        transform: scale(0.7);
    }

    50% {
        opacity: 1;
        transform: scale(1.5);
    }
}


/* =========================
   CORAÇÕES
========================= */

.coracao {
    position: absolute;
    bottom: -60px;

    color: #ff1744;
    font-size: 25px;

    text-shadow:
        0 0 5px #ff1744,
        0 0 15px #ff1744,
        0 0 30px rgba(255, 23, 68, 0.8);

    animation: subir linear infinite;

    pointer-events: none;
}

@keyframes subir {

    0% {
        transform:
            translateY(0)
            scale(0.7)
            rotate(0deg);

        opacity: 0;
    }

    10% {
        opacity: 1;
    }

    50% {
        transform:
            translateY(-50vh)
            translateX(30px)
            scale(1)
            rotate(10deg);
    }

    100% {
        transform:
            translateY(-115vh)
            translateX(-40px)
            scale(0.8)
            rotate(-10deg);

        opacity: 0;
    }
}


/* =========================
   ÁREA DA FLOR
========================= */

.flor-container {

    position: absolute;

    left: 50%;
    top: 46%;

    transform: translate(-50%, -50%);

    width: 400px;
    height: 500px;

    display: flex;
    justify-content: center;
    align-items: center;

    animation: aparecerFlor 2s ease forwards;
}

@keyframes aparecerFlor {

    from {
        opacity: 0;
        transform: translate(-50%, -45%) scale(0.7);
    }

    to {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
    }
}


/* =========================
   SVG
========================= */

svg {
    width: 100%;
    height: 100%;

    overflow: visible;
}


/* =========================
   CAULE
========================= */

.caule {
    fill: none;

    stroke: #24d35d;
    stroke-width: 8;
    stroke-linecap: round;

    filter:
        drop-shadow(0 0 5px #24d35d)
        drop-shadow(0 0 12px rgba(36, 211, 93, 0.8));

    stroke-dasharray: 400;
    stroke-dashoffset: 400;

    animation:
        desenharCaule 2.5s ease forwards;
}

@keyframes desenharCaule {

    to {
        stroke-dashoffset: 0;
    }
}


/* =========================
   FOLHAS
========================= */

.folha {
    fill: #20b957;

    filter:
        drop-shadow(0 0 5px #20b957)
        drop-shadow(0 0 10px rgba(32, 185, 87, 0.8));

    transform-origin: center;
    animation: nascerFolha 1.5s ease forwards;

    opacity: 0;
}

.folha1 {
    animation-delay: 1.8s;
}

.folha2 {
    animation-delay: 2.1s;
}

@keyframes nascerFolha {

    from {
        opacity: 0;
        transform: scale(0);
    }

    to {
        opacity: 1;
        transform: scale(1);
    }
}


/* =========================
   PÉTALAS
========================= */

.petala {

    fill: #ff3d81;

    stroke: #ff77a8;
    stroke-width: 2;

    filter:
        drop-shadow(0 0 5px #ff2770)
        drop-shadow(0 0 15px rgba(255, 39, 112, 0.8));

    transform-box: fill-box;
    transform-origin: center;

    opacity: 0;

    animation:
        abrirPetala 2s cubic-bezier(.17,.67,.35,1.3) forwards;
}


/* atrasos diferentes */

.petala:nth-child(1) {
    animation-delay: 2.0s;
}

.petala:nth-child(2) {
    animation-delay: 2.1s;
}

.petala:nth-child(3) {
    animation-delay: 2.2s;
}

.petala:nth-child(4) {
    animation-delay: 2.3s;
}

.petala:nth-child(5) {
    animation-delay: 2.4s;
}

.petala:nth-child(6) {
    animation-delay: 2.5s;
}

.petala:nth-child(7) {
    animation-delay: 2.6s;
}

.petala:nth-child(8) {
    animation-delay: 2.7s;
}

@keyframes abrirPetala {

    0% {
        opacity: 0;
        transform: scale(0) rotate(-20deg);
    }

    60% {
        opacity: 1;
        transform: scale(1.15) rotate(5deg);
    }

    100% {
        opacity: 1;
        transform: scale(1) rotate(0deg);
    }
}


/* =========================
   CENTRO DA FLOR
========================= */

.centro {

    fill: #ffd600;

    filter:
        drop-shadow(0 0 6px #ffd600)
        drop-shadow(0 0 15px #ff9800);

    opacity: 0;

    animation:
        aparecerCentro 1.5s ease forwards;

    animation-delay: 3s;

    transform-box: fill-box;
    transform-origin: center;
}

@keyframes aparecerCentro {

    from {
        opacity: 0;
        transform: scale(0);
    }

    to {
        opacity: 1;
        transform: scale(1);
    }
}


/* =========================
   BRILHOS
========================= */

.brilho {

    position: absolute;

    width: 5px;
    height: 5px;

    background: white;

    border-radius: 50%;

    box-shadow:
        0 0 5px white,
        0 0 15px #ffeb3b,
        0 0 30px #ffeb3b;

    animation:
        brilhoAparecer 2s ease-in-out infinite;
}

@keyframes brilhoAparecer {

    0%, 100% {
        opacity: 0.1;
        transform: scale(0.5);
    }

    50% {
        opacity: 1;
        transform: scale(1.5);
    }
}


/* =========================
   MENSAGEM
========================= */

.mensagem {

    position: absolute;

    bottom: 7%;
    left: 50%;

    transform: translateX(-50%);

    width: 90%;

    text-align: center;

    opacity: 0;

    animation:
        aparecerMensagem 2s ease forwards;

    animation-delay: 4s;
}

.mensagem h1 {

    font-size: clamp(32px, 7vw, 60px);

    font-weight: normal;

    color: #fff;

    text-shadow:
        0 0 5px white,
        0 0 15px #ff4081,
        0 0 30px #ff4081,
        0 0 50px rgba(255, 64, 129, 0.8);

    margin-bottom: 12px;
}

.mensagem p {

    font-size: clamp(15px, 3vw, 21px);

    color: #f5f5f5;

    letter-spacing: 2px;

    text-shadow:
        0 0 5px #fff,
        0 0 12px rgba(255, 255, 255, 0.5);
}

@keyframes aparecerMensagem {

    from {
        opacity: 0;
        transform:
            translateX(-50%)
            translateY(20px);
    }

    to {
        opacity: 1;
        transform:
            translateX(-50%)
            translateY(0);
    }
}


/* =========================
   RESPONSIVO
========================= */

@media (max-width: 600px) {

    .flor-container {
        width: 320px;
        height: 420px;
        top: 42%;
    }

    .mensagem {
        bottom: 5%;
    }

}

</style>
</head>


<body>


<!-- =========================
     FUNDO
========================= -->

<div class="fundo" id="fundo"></div>


<!-- =========================
     FLOR
========================= -->

<div class="flor-container">

<svg viewBox="0 0 400 500">

    <!-- CAULE -->

    <path
        class="caule"
        d="M200 450 C200 370 195 300 200 220"
    />


    <!-- FOLHAS -->

    <ellipse
        class="folha folha1"
        cx="175"
        cy="340"
        rx="55"
        ry="20"
        transform="rotate(-30 175 340)"
    />

    <ellipse
        class="folha folha2"
        cx="225"
        cy="300"
        rx="55"
        ry="20"
        transform="rotate(30 225 300)"
    />


    <!-- PÉTALAS -->

    <ellipse
        class="petala"
        cx="200"
        cy="170"
        rx="55"
        ry="105"
        transform="rotate(0 200 200)"
    />

    <ellipse
        class="petala"
        cx="200"
        cy="170"
        rx="55"
        ry="105"
        transform="rotate(45 200 200)"
    />

    <ellipse
        class="petala"
        cx="200"
        cy="170"
        rx="55"
        ry="105"
        transform="rotate(90 200 200)"
    />

    <ellipse
        class="petala"
        cx="200"
        cy="170"
        rx="55"
        ry="105"
        transform="rotate(135 200 200)"
    />

    <ellipse
        class="petala"
        cx="200"
        cy="170"
        rx="55"
        ry="105"
        transform="rotate(180 200 200)"
    />

    <ellipse
        class="petala"
        cx="200"
        cy="170"
        rx="55"
        ry="105"
        transform="rotate(225 200 200)"
    />

    <ellipse
        class="petala"
        cx="200"
        cy="170"
        rx="55"
        ry="105"
        transform="rotate(270 200 200)"
    />

    <ellipse
        class="petala"
        cx="200"
        cy="170"
        rx="55"
        ry="105"
        transform="rotate(315 200 200)"
    />


    <!-- CENTRO -->

    <circle
        class="centro"
        cx="200"
        cy="200"
        r="38"
    />

</svg>

</div>


<!-- =========================
     BRILHOS
========================= -->

<div
    class="brilho"
    style="left:25%; top:30%; animation-delay:1s;"
></div>

<div
    class="brilho"
    style="left:70%; top:25%; animation-delay:2s;"
></div>

<div
    class="brilho"
    style="left:80%; top:55%; animation-delay:.5s;"
></div>

<div
    class="brilho"
    style="left:15%; top:65%; animation-delay:1.5s;"
></div>


<!-- =========================
     MENSAGEM
========================= -->

<div class="mensagem">

    <h1>Para você ❤️</h1>

    <p>
        Algumas coisas bonitas
        simplesmente merecem ser sentidas.
    </p>

</div>


<script>

/* =========================
   CRIAR PONTOS AMARELOS
========================= */

const fundo = document.getElementById("fundo");

for (let i = 0; i < 100; i++) {

    const ponto = document.createElement("div");

    ponto.classList.add("ponto");

    ponto.style.left =
        Math.random() * 100 + "%";

    ponto.style.top =
        Math.random() * 100 + "%";

    ponto.style.animationDelay =
        Math.random() * 4 + "s";

    ponto.style.animationDuration =
        (2 + Math.random() * 4) + "s";

    const tamanho =
        1 + Math.random() * 3;

    ponto.style.width =
        tamanho + "px";

    ponto.style.height =
        tamanho + "px";

    fundo.appendChild(ponto);
}


/* =========================
   CRIAR CORAÇÕES
========================= */

function criarCoracao() {

    const coracao =
        document.createElement("div");

    coracao.classList.add("coracao");

    coracao.innerHTML = "♥";

    coracao.style.left =
        Math.random() * 100 + "%";

    const tamanho =
        15 + Math.random() * 25;

    coracao.style.fontSize =
        tamanho + "px";

    const duracao =
        6 + Math.random() * 7;

    coracao.style.animationDuration =
        duracao + "s";

    coracao.style.opacity =
        0.4 + Math.random() * 0.6;

    document.body.appendChild(coracao);


    setTimeout(() => {

        coracao.remove();

    }, duracao * 1000);
}


/* =========================
   GERAR CORAÇÕES
========================= */

setInterval(
    criarCoracao,
    700
);


/* =========================
   PRIMEIROS CORAÇÕES
========================= */

for (let i = 0; i < 12; i++) {

    setTimeout(
        criarCoracao,
        i * 300
    );

}

</script>

</body>
</html>
