<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flor Neon Animada</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #000;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: Arial, sans-serif;
    }

    /* Canvas para partículas (pontos amarelos e corações) */
    #particles-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    /* Container Principal da Flor */
    .flower-container {
      position: relative;
      width: 350px;
      height: 500px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      z-index: 2;
    }

    /* Caule Neon */
    .stem {
      position: absolute;
      bottom: 20px;
      width: 8px;
      height: 220px;
      background: #00ff66;
      border-radius: 4px;
      box-shadow: 0 0 10px #00ff66, 0 0 20px #00ff66, 0 0 40px #00ff66;
      animation: pulse-stem 3s infinite alternate ease-in-out;
    }

    /* Folhas Neon */
    .leaf {
      position: absolute;
      width: 70px;
      height: 40px;
      background: radial-gradient(circle, #00ff66 20%, #003311 90%);
      border: 2px solid #00ff66;
      border-radius: 0px 70px 0px 70px;
      box-shadow: 0 0 12px #00ff66, inset 0 0 8px #00ff66;
    }

    .leaf.left {
      bottom: 100px;
      left: 80px;
      transform: rotate(-25deg);
      animation: sway-left 4s infinite alternate ease-in-out;
    }

    .leaf.right {
      bottom: 140px;
      right: 80px;
      transform: scaleX(-1) rotate(-25deg);
      animation: sway-right 4s infinite alternate ease-in-out;
    }

    /* Vegetação de fundo na base */
    .bush {
      position: absolute;
      bottom: 10px;
      width: 280px;
      height: 60px;
      border-radius: 50% 50% 0 0;
      background: radial-gradient(circle, rgba(0,255,102,0.2) 0%, rgba(0,0,0,0) 80%);
      filter: drop-shadow(0 0 15px #00ff66);
    }

    /* Flor (Pétalas + Miolo) */
    .flower {
      position: absolute;
      top: 100px;
      width: 120px;
      height: 120px;
      display: flex;
      justify-content: center;
      align-items: center;
      animation: breathe 4s infinite ease-in-out;
    }

    /* Miolo Neon Amarelo */
    .center-core {
      position: absolute;
      width: 50px;
      height: 50px;
      background: #ffff00;
      border-radius: 50%;
      box-shadow: 0 0 15px #ffff00, 0 0 30px #ffff00, 0 0 50px #ffff00;
      z-index: 10;
    }

    /* Pétalas Rosa Neon */
    .petal {
      position: absolute;
      width: 50px;
      height: 110px;
      background: rgba(255, 0, 127, 0.7);
      border: 2px solid #ff007f;
      border-radius: 50px 50px 0 0;
      transform-origin: bottom center;
      box-shadow: 0 0 15px #ff007f, 0 0 30px #ff007f, inset 0 0 15px #ff66cc;
    }

    /* Posicionamento circular de 8 pétalas */
    .petal:nth-child(1) { transform: rotate(0deg) translateY(-50px); }
    .petal:nth-child(2) { transform: rotate(45deg) translateY(-50px); }
    .petal:nth-child(3) { transform: rotate(90deg) translateY(-50px); }
    .petal:nth-child(4) { transform: rotate(135deg) translateY(-50px); }
    .petal:nth-child(5) { transform: rotate(180deg) translateY(-50px); }
    .petal:nth-child(6) { transform: rotate(225deg) translateY(-50px); }
    .petal:nth-child(7) { transform: rotate(270deg) translateY(-50px); }
    .petal:nth-child(8) { transform: rotate(315deg) translateY(-50px); }

    /* Animações CSS */
    @keyframes breathe {
      0%, 100% { transform: scale(1) rotate(0deg); }
      50% { transform: scale(1.08) rotate(3deg); }
    }

    @keyframes pulse-stem {
      0%, 100% { box-shadow: 0 0 10px #00ff66, 0 0 20px #00ff66; }
      50% { box-shadow: 0 0 15px #00ff66, 0 0 35px #00ff66, 0 0 50px #00ff66; }
    }

    @keyframes sway-left {
      0%, 100% { transform: rotate(-25deg); }
      50% { transform: rotate(-30deg) scale(1.05); }
    }

    @keyframes sway-right {
      0%, 100% { transform: scaleX(-1) rotate(-25deg); }
      50% { transform: scaleX(-1) rotate(-30deg) scale(1.05); }
    }
  </style>
</head>
<body>

  <!-- Canvas de partículas de fundo (Pontos amarelos + Corações saindo) -->
  <canvas id="particles-canvas"></canvas>

  <!-- Estrutura da Flor Neon -->
  <div class="flower-container">
    <div class="bush"></div>
    <div class="stem"></div>
    <div class="leaf left"></div>
    <div class="leaf right"></div>
    
    <div class="flower">
      <div class="petal"></div>
      <div class="petal"></div>
      <div class="petal"></div>
      <div class="petal"></div>
      <div class="petal"></div>
      <div class="petal"></div>
      <div class="petal"></div>
      <div class="petal"></div>
      <div class="center-core"></div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('particles-canvas');
    const ctx = canvas.getContext('2d');

    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });

    // Array de partículas
    const particles = [];
    const hearts = [];

    // Desenhar um Coração em Neon no Canvas
    function drawHeart(x, y, size, color, alpha) {
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.beginPath();
      ctx.translate(x, y);
      ctx.moveTo(0, 0);
      
      // Desenho do formato de coração usando curvas de bézier
      ctx.bezierCurveTo(-size / 2, -size / 2, -size, size / 3, 0, size);
      ctx.bezierCurveTo(size, size / 3, size / 2, -size / 2, 0, 0);
      
      ctx.fillStyle = color;
      ctx.shadowColor = color;
      ctx.shadowBlur = 15;
      ctx.fill();
      ctx.restore();
    }

    // Criar Pontos Neon Amarelos Flutuantes (Vagalumes / Brilhos)
    class YellowDot {
      constructor() {
        this.reset();
      }

      reset() {
        this.x = Math.random() * width;
        this.y = Math.random() * height;
        this.radius = Math.random() * 2.5 + 1;
        this.vy = -(Math.random() * 0.8 + 0.2);
        this.vx = (Math.random() - 0.5) * 0.5;
        this.alpha = Math.random() * 0.8 + 0.2;
        this.pulse = Math.random() * 0.05 + 0.01;
      }

      update() {
        this.y += this.vy;
        this.x += this.vx;
        this.alpha += Math.sin(Date.now() * 0.003) * 0.01;

        if (this.y < -10 || this.x < -10 || this.x > width + 10) {
          this.reset();
          this.y = height + 10;
        }
      }

      draw() {
        ctx.save();
        ctx.globalAlpha = Math.max(0, Math.min(1, this.alpha));
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = '#ffff00';
        ctx.shadowColor = '#ffff00';
        ctx.shadowBlur = 12;
        ctx.fill();
        ctx.restore();
      }
    }

    // Criar Corações Neon Rosa Fluindo para cima
    class NeonHeart {
      constructor() {
        this.reset();
      }

      reset() {
        // Surgem próximos ao centro (da flor)
        this.x = width / 2 + (Math.random() - 0.5) * 100;
        this.y = height / 2 + (Math.random() - 0.5) * 50;
        this.size = Math.random() * 12 + 8;
        this.vy = -(Math.random() * 1.5 + 0.8);
        this.vx = (Math.random() - 0.5) * 1.2;
        this.alpha = 1;
        this.decay = Math.random() * 0.008 + 0.004;
        this.color = Math.random() > 0.3 ? '#ff007f' : '#ff66cc';
      }

      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.alpha -= this.decay;

        if (this.alpha <= 0) {
          this.reset();
        }
      }

      draw() {
        if (this.alpha > 0) {
          drawHeart(this.x, this.y, this.size, this.color, this.alpha);
        }
      }
    }

    // Inicialização das partículas
    for (let i = 0; i < 70; i++) {
      particles.push(new YellowDot());
    }

    for (let i = 0; i < 25; i++) {
      hearts.push(new NeonHeart());
    }

    // Loop de Animação
    function animate() {
      ctx.clearRect(0, 0, width, height);

      // Atualiza e desenha os pontos amarelos
      particles.forEach(p => {
        p.update();
        p.draw();
      });

      // Atualiza e desenha os corações rosa neon
      hearts.forEach(h => {
        h.update();
        h.draw();
      });

      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
